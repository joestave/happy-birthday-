<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Lalezar&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{--bg:#2b0f3f;--bg2:#5a1d6b;--pink:#ff7eb6;--gold:#ffd166;--cream:#fff4e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 20%,var(--bg2),var(--bg));color:var(--cream);font-family:'Cairo',system-ui,sans-serif;overflow-x:hidden}
#lock{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center;z-index:10;background:radial-gradient(circle at 50% 30%,var(--bg2),var(--bg));transition:opacity .8s}
#lock.out{opacity:0;pointer-events:none}
.hb{direction:ltr;font-family:'Pacifico',cursive;font-size:clamp(40px,11vw,92px);line-height:1.2;color:var(--gold);text-shadow:0 4px 24px rgba(255,126,182,.6)}
.hb span{display:inline-block;animation:wave 1.8s ease-in-out infinite}
.hb .sp{width:.3em}
@keyframes wave{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-14px) rotate(3deg);color:var(--pink)}}
.row{display:flex;gap:10px;width:min(360px,100%)}
input{flex:1;min-width:0;padding:14px 16px;border-radius:14px;border:2px solid var(--pink);background:rgba(255,255,255,.08);color:var(--cream);font:inherit;font-size:18px;text-align:center;direction:ltr;outline:none}
input:focus-visible{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,209,102,.4)}
button{padding:14px 22px;border:0;border-radius:14px;background:var(--gold);color:#3b1250;font:inherit;font-weight:700;font-size:18px;cursor:pointer}
button:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
#err{min-height:24px;color:var(--pink);font-weight:700}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.b{position:absolute;bottom:-120px;width:44px;height:56px;border-radius:50% 50% 48% 48%;opacity:.8;animation:up linear infinite}
.b:after{content:"";position:absolute;left:50%;top:100%;width:1px;height:40px;background:rgba(255,255,255,.5)}
@keyframes up{to{transform:translateY(-120vh)}}
#cakes{position:fixed;inset:0;overflow:hidden;z-index:0;opacity:.55}
#cakes i{position:absolute;font-style:normal;font-size:44px;line-height:1;transform:scale(0);animation:pop .6s cubic-bezier(.3,1.6,.5,1) forwards,bob 3s ease-in-out infinite}
@keyframes pop{to{transform:scale(1)}}
@keyframes bob{50%{margin-top:-8px}}
#main{position:relative;z-index:2;display:none;padding:28px 16px 60px;max-width:900px;margin:0 auto}
.msg{background:rgba(43,15,63,.88);border:2px solid var(--gold);border-radius:22px;padding:26px 24px;font-size:clamp(18px,4.6vw,24px);line-height:2;backdrop-filter:blur(4px);box-shadow:0 10px 40px rgba(0,0,0,.4)}
.msg h2{font-family:'Lalezar',sans-serif;font-weight:400;color:var(--gold);font-size:1.5em;margin:0}
.msg p{margin:6px 0}.msg .sig{text-align:left;font-family:'Lalezar',sans-serif;color:var(--pink);font-size:1.3em;margin-top:10px}
.ln{opacity:0;transform:translateY(12px);animation:in .9s forwards}
@keyframes in{to{opacity:1;transform:none}}
#pics{display:flex;flex-wrap:wrap;justify-content:center;gap:22px;margin-top:34px}
.ph{width:min(240px,44%);background:#fff;padding:8px 8px 8px;border-radius:6px;box-shadow:0 8px 26px rgba(0,0,0,.5);opacity:0;transform:translateY(80px) scale(.4) rotate(var(--r));animation:ph .9s cubic-bezier(.3,1.5,.5,1) forwards}
.ph img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:3px}
@keyframes ph{to{opacity:1;transform:rotate(var(--r))}}
@media(max-width:520px){.ph{width:44%}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div id="cakes" aria-hidden="true"></div>
<div id="lock">
  <div class="hb" id="hb" aria-label="Happy Birthday"></div>
  <div class="row"><input id="pw" inputmode="numeric" placeholder="اكتب كلمة المرور" autocomplete="off"><button id="go">افتح</button></div>
  <div id="err" role="alert"></div>
</div>
<main id="main">
  <section class="msg">
    <h2 class="ln" style="animation-delay:.3s">د/ مريم،</h2>
    <p class="ln" style="animation-delay:1.2s">البنت اللي عرفتها من قريب جدًا، بس مبسوط جدًا إني عرفتك، وفخور بكل حاجة بتعمليها مهما كان حجمها. حبيت أعيد عليكي بطريقتي.</p>
    <div class="sig ln" style="animation-delay:2.4s">م/ جوستاف</div>
  </section>
  <section id="pics"></section>
</main>

const hb=document.getElementById('hb');
[...'Happy Birthday'].forEach((c,i)=>{const s=document.createElement('span');if(c===' ')s.className='sp';s.textContent=c===' '?'\u00a0':c;s.style.animationDelay=(i*.1)+'s';hb.appendChild(s)});
const lock=document.getElementById('lock'),cols=['#ff7eb6','#ffd166','#7ee0ff','#b88cff','#8cffb4'];
for(let i=0;i<14;i++){const b=document.createElement('div');b.className='b';b.style.cssText=`left:${Math.random()*96}%;background:${cols[i%5]};animation-duration:${7+Math.random()*7}s;animation-delay:${-Math.random()*10}s`;lock.appendChild(b)}
const pw=document.getElementById('pw'),err=document.getElementById('err'),au=document.getElementById('au');
function tryOpen(){
  if(pw.value.replace(/\D/g,'')==='15102007'){
    au.currentTime=0;au.play().catch(()=>{});
    lock.classList.add('out');setTimeout(()=>lock.style.display='none',800);
    document.getElementById('main').style.display='block';
    fillCakes();showPics();
  }else{err.textContent='كلمة المرور غلط، جرّبي تاني 🙈';lock.classList.remove('shake');void lock.offsetWidth;lock.classList.add('shake')}
}
document.getElementById('go').onclick=tryOpen;
pw.addEventListener('keydown',e=>{if(e.key==='Enter')tryOpen()});
function fillCakes(){
  const box=document.getElementById('cakes'),s=60,c=Math.ceil(innerWidth/s),r=Math.ceil(innerHeight/s);
  const cells=[];for(let y=0;y<r;y++)for(let x=0;x<c;x++)cells.push([x,y]);
  cells.sort(()=>Math.random()-.5);
  cells.forEach(([x,y],i)=>{const e=document.createElement('i');e.textContent='🎂';e.style.left=x*s+'px';e.style.top=y*s+'px';e.style.animationDelay=(i/cells.length*5)+'s,'+(Math.random()*3)+'s';box.appendChild(e)});
}
function showPics(){
  const p=document.getElementById('pics');
  IMGS.forEach((src,i)=>{const d=document.createElement('div');d.className='ph';d.style.setProperty('--r',((i%2?1:-1)*(2+Math.random()*4))+'deg');d.style.animationDelay=(3.5+i*.9)+'s';d.innerHTML='<img alt="" src="'+src+'">';p.appendChild(d)});
}
</script>
